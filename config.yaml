universe:
  source: sp500
  custom_tickers:
  - AAPL
  - MSFT
  - NVDA
  - AMD
  - AVGO
  semiconductors:
    always_include: true
    min_ai_weight: 0.0
  excluded_tickers:
  - MRVL
  min_price: 5.0
  max_price: 1500.0
  min_avg_volume: 500000
strategy:
  style: swing
  lookback_days: 180
weights:
  trend: 0.18
  momentum: 0.2
  volatility: 0.08
  volume: 0.05
  fundamentals: 0.14
  sentiment: 0.12
  indicators: 0.23
sector:
  semi_boost: 1.1
  ai_boost: 0.2
risk:
  account_size: 10000.0
  risk_per_trade_pct: 1.0
  max_positions: 5
  max_daily_loss_pct: 3.0
  stop_loss_atr_mult: 1.5
  take_profit_atr_mult: 3.0
output:
  top_n_picks: 10
  min_score: 0.55
  save_csv: true
  csv_path: data/picks.csv
llm:
  enabled: true
  model: claude-sonnet-4-5
  max_tokens: 500

# ═══════════════════════════════════════════════════════════════
# PR #67: DAY TRADING CONFIGURATION
# ═══════════════════════════════════════════════════════════════
day_trading:
  enabled: true
  max_picks: 3              # max DAY picks per session
  min_score: 0.65           # day_score threshold
  atr_mult_sl: 0.6          # tight stop (~1-1.5% typical)
  atr_mult_tp1: 1.0         # quick target (~1.5-2%)
  atr_mult_tp2: 1.8         # full target (~3%)
  max_hold_minutes: 240     # force EOD close (4 hours)
  min_rvol: 1.2             # require above-avg volume
  min_dollar_volume: 20000000  # $20M daily liquidity
  
swing_trading:
  enabled: true
  max_picks: 5              # max SWING picks per session
  min_score: 0.55           # existing threshold
  # Uses existing atr_mult_sl=2.0 from risk: section