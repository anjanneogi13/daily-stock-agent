universe:
  source: sp500
  include_watchlist: true   # PR #68: bullish-news tickers in scoring pool
  custom_tickers:
  - AAPL
  - MSFT
  - NVDA
  - AMD
  - AVGO
  semiconductors:
    always_include: true
    min_ai_weight: 0.0
  excluded_tickers:
  # MRVL: original exclusion (owner preference)
  - MRVL
  # Added 2026-05-03: HEURISTIC exclusion — UNVERIFIED, not backtest-validated.
  # Derived from an in-dev backtest that is survivorship-biased, uses a
  # mis-annualized Sharpe, has no unit tests, and runs in no CI. Treat the
  # per-ticker R-values below as illustrative heuristics, NOT proven results.
  # See docs/audit/COFOUNDER_AUDIT_2026-06-24.md
  - UNH    # -1.35R avg per pick — worst loser in universe
  - TEAM   # -1.00R avg per pick
  - SMCI   # -0.94R avg per pick — also high vol penalty
  - DIS    #  -0.64R avg per pick
  - SCHW   # -0.64R avg per pick
  min_price: 5.0
  max_price: 1500.0
  min_avg_volume: 500000
strategy:
  style: swing
  lookback_days: 180
weights:
  trend: 0.18
  momentum: 0.2
  volatility: 0.08
  volume: 0.05
  fundamentals: 0.14
  sentiment: 0.12
  indicators: 0.23
sector:
  # ⚠ DISABLED 2026-05-02 (HEURISTIC, UNVERIFIED — not backtest-validated):
  # a SEMI-bias "−24.8 Sharpe leak" was claimed by an in-dev backtest that is
  # survivorship-biased and untested; treat as preference, not proven evidence.
  # Original: semi_boost 1.1, ai_boost 0.2  (gave SEMI/AI stocks +30% score)
  semi_boost: 1.0
  ai_boost: 0.0
risk:
  account_size: 10000.0
  risk_per_trade_pct: 1.0
  max_positions: 5
  max_daily_loss_pct: 3.0
  stop_loss_atr_mult: 1.5
  take_profit_atr_mult: 3.0
output:
  top_n_picks: 10
  min_score: 0.55
  save_csv: true
  csv_path: data/picks.csv

# ═══════════════════════════════════════════════════════════════
# QUALITY GATE (added 2026-10-29 audit) — see src/quality_gate.py
# Evidence from the 110 closed official picks (May→Oct 2026):
#   final score <= 0.70 : n=71, total -19.6R (mean ≈ -0.28R)
#   rvol < 0.8          : n=17, mean -0.49R
#   pass (score>=0.70 & rvol>=0.8): n=37 mean -0.02R | fail: n=73 mean -0.25R
# Applied after the earnings-quality blend + news boost, before the top-N
# trim. Fewer picks on thin days is intended. QUALITY_GATE_MODE env var
# (enforce|observe|off) overrides `mode`.
# ═══════════════════════════════════════════════════════════════
quality_gate:
  enabled: true
  mode: enforce
  min_final_score: 0.70
  min_rvol: 0.8
llm:
  enabled: true
  model: claude-sonnet-4-5
  max_tokens: 500

# ═══════════════════════════════════════════════════════════════
# PR #67: DAY TRADING CONFIGURATION
# ═══════════════════════════════════════════════════════════════
day_trading:
  enabled: true
  max_picks: 3              # NOTE (2026-10-29 audit): not read by any code path
  min_score: 0.65           # NOTE: not read by any code path (tagging uses day_score internally)
  atr_mult_sl: 0.6          # tight stop (~1-1.5% typical)
  atr_mult_tp1: 1.0         # quick target (~1.5-2%)
  atr_mult_tp2: 1.8         # full target (~3%)
  max_hold_minutes: 240     # force EOD close (4 hours)
  min_rvol: 1.2             # NOTE: not read by any code path; pick-level rvol floor is quality_gate.min_rvol
  min_dollar_volume: 20000000  # $20M daily liquidity
  
swing_trading:
  enabled: true
  max_picks: 5              # NOTE (2026-10-29 audit): not read by any code path (output.top_n_picks gates)
  min_score: 0.55           # NOTE: not read by any code path (output.min_score + quality_gate gate)
  # Swing SL/TP come from risk.stop_loss_atr_mult / risk.take_profit_atr_mult
  # (1.5x / 3.0x ATR -> R:R 2.0). Override here with atr_mult_sl / atr_mult_tp.
  # Audit 2026-10-29: the scorer previously ignored these and hardcoded
  # 2.0x/2.5x ATR (R:R 1.25), which needs a >44% win rate to break even.

# 💎 Monster Hunt Mode (added Sunday May 3 2026)
# Detects asymmetric high-conviction setups and gives them lottery treatment:
#   wider SL (5%), aggressive TP (25%), smaller position (1.5%)
# See src/monster_hunt.py for full scoring rubric.
monster:
  enabled: true
  threshold: 0.60          # min monster_score to activate treatment
  position_pct: 1.5        # % of account_size per monster pick (lottery sizing)
  sl_pct: 5.0              # wider stop loss
  tp_pct: 25.0             # aggressive take profit
  fetch_short_float: true  # fetch yfinance shortPercentOfFloat + floatShares
