name: Morning Run Watchdog

# Pre-market reliability watchdog.
#
# GitHub scheduled workflows are best-effort, so this checks BEFORE market open
# whether official daily picks have actually been logged. If not, it sends an
# urgent Telegram alert while there is still time to manually trigger
# daily-picks before the 09:20 ET hard cutoff.
#
# Safety:
# - This workflow does not create picks itself.
# - This workflow does not bypass the daily-picks timing gate.
# - This workflow does not enable paper/live trading.

on:
  schedule:
    # Delay-compensated slots. Nominal fire times during EDT are
    # 08:40, 08:55, 09:40 and 09:55 ET (07:40-08:55 ET during EST).
    # GitHub cron is best-effort and often 30-90 minutes late, so earlier
    # nominal slots are what actually land near the 09:20 ET cutoff.
    # The ET guard below only acts between 08:30 and 10:59 ET and dedups
    # alerts, instead of skipping delayed runs as a wrong DST hour.
    - cron: '40,55 12-13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if today's picks are logged before cutoff
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        run: |
          ET_HOUR=$(TZ='America/New_York' date +%H)
          ET_MIN=$(TZ='America/New_York' date +%M)
          ET_DATE=$(TZ='America/New_York' date +%Y-%m-%d)
          ET_MINUTES_OF_DAY=$((10#$ET_HOUR * 60 + 10#$ET_MIN))
          OFFICIAL_CUTOFF=$((9 * 60 + 20))
          WATCH_WINDOW_START=$((8 * 60 + 30))
          WATCH_WINDOW_END=$((11 * 60))

          echo "Watchdog firing at $ET_DATE $ET_HOUR:$ET_MIN ET"
          python scripts/record_daily_picks_run_status.py --workflow watchdog --event watchdog_started --result started --reason "watchdog checking daily picks status"

          # GitHub cron delays previously pushed every "correct slot" run past
          # 09:59 ET, where an exact-hour DST check misclassified it as a
          # duplicate and skipped it — so the watchdog never rescued or
          # alerted (2026-08-06..13). Act inside a window instead.
          if [ "$ET_MINUTES_OF_DAY" -lt "$WATCH_WINDOW_START" ]; then
            echo "⏭ Before 08:30 ET watch window ($ET_HOUR:$ET_MIN ET) — skipping"
            python scripts/record_daily_picks_run_status.py --workflow watchdog --event watchdog_before_window_skip --result skipped --reason "before 08:30 ET watch window"
            exit 0
          fi
          if [ "$ET_MINUTES_OF_DAY" -ge "$WATCH_WINDOW_END" ]; then
            echo "⏭ After 11:00 ET watch window ($ET_HOUR:$ET_MIN ET) — stale run, skipping"
            python scripts/record_daily_picks_run_status.py --workflow watchdog --event watchdog_after_window_skip --result skipped --reason "after 11:00 ET watch window"
            exit 0
          fi

          # Refresh shared evidence from origin: picks may have been pushed
          # after this job's checkout, and an earlier watchdog run may have
          # already alerted today.
          STATUS_FILE="data/daily_picks_run_status_${ET_DATE}.jsonl"
          git fetch origin main --depth 1 2>/dev/null || true
          git checkout FETCH_HEAD -- data/picks_log.csv 2>/dev/null || true
          REMOTE_STATUS=$(git show "FETCH_HEAD:$STATUS_FILE" 2>/dev/null || true)
          LEDGER_ALL=$(printf '%s\n' "$REMOTE_STATUS"; cat "$STATUS_FILE" 2>/dev/null || true)

          TODAY_ROWS=0
          if [ -f data/picks_log.csv ]; then
            TODAY_ROWS=$(grep -c "^$ET_DATE" data/picks_log.csv 2>/dev/null || true)
            TODAY_ROWS="${TODAY_ROWS:-0}"
          fi

          if [ "$TODAY_ROWS" -gt 0 ]; then
            echo "✅ Picks already logged for $ET_DATE: $TODAY_ROWS row(s)"
            python scripts/record_daily_picks_run_status.py --workflow watchdog --event watchdog_checked --result picks_present --reason "picks already logged before cutoff" --picks-logged "$TODAY_ROWS"
            exit 0
          fi

          # One alert per day: skip only if an earlier watchdog alert SUCCEEDED,
          # so failed sends are retried by later slots.
          if printf '%s\n' "$LEDGER_ALL" | grep '"event": "watchdog_alert"' | grep -q '"result": "success"'; then
            echo "⏭ Watchdog already alerted for $ET_DATE — skipping duplicate alert"
            python scripts/record_daily_picks_run_status.py --workflow watchdog --event watchdog_already_alerted_skip --result skipped --reason "watchdog alert already sent for ET date" --picks-logged 0
            exit 0
          fi

          python scripts/record_daily_picks_run_status.py --workflow watchdog --event watchdog_checked --result missing_picks --reason "no daily picks rows before cutoff" --picks-logged 0

          # External scheduler health: cron-job.org should have dispatched
          # daily-picks via workflow_dispatch during premarket. If no
          # workflow_dispatch trigger is on today's ledger, the external
          # scheduler is presumed down (e.g. expired PAT or disabled jobs).
          EXTERNAL_NOTE=""
          if ! printf '%s\n' "$LEDGER_ALL" | grep -q '"event_name": "workflow_dispatch"'; then
            EXTERNAL_NOTE="%0A%0A⚠️ External scheduler appears DOWN: no workflow_dispatch trigger recorded today. Check cron-job.org jobs and rotate the GitHub PAT if expired."
          fi

          RESCUE_TRIGGERED=0
          if [ "$ET_MINUTES_OF_DAY" -gt "$OFFICIAL_CUTOFF" ]; then
            WINDOW_NOTE="The 09:20 ET cutoff has passed. Do not send normal premarket picks now; use intraday monitor only."
          else
            WINDOW_NOTE="There is still time before the 09:20 ET cutoff. Watchdog is attempting to trigger Daily Stock Picks automatically now."
            HTTP_CODE=$(curl -sS -X POST \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily-picks.yml/dispatches" \
              -d '{"ref":"main"}' \
              -o /tmp/daily_picks_dispatch_response.txt \
              -w "%{http_code}" || true)

            if echo "$HTTP_CODE" | grep -Eq '^(204|201)$'; then
              RESCUE_TRIGGERED=1
              python scripts/record_daily_picks_run_status.py --workflow watchdog --event watchdog_rescue_dispatch --result success --reason "watchdog triggered Daily Stock Picks workflow before cutoff" --picks-logged 0
              echo "✅ Watchdog triggered Daily Stock Picks workflow"
            else
              python scripts/record_daily_picks_run_status.py --workflow watchdog --event watchdog_rescue_dispatch --result failed --reason "watchdog failed to trigger Daily Stock Picks workflow before cutoff" --picks-logged 0
              echo "⚠️ Watchdog failed to trigger Daily Stock Picks workflow; HTTP=$HTTP_CODE"
              cat /tmp/daily_picks_dispatch_response.txt || true
            fi
          fi

          MSG="🚨 *Daily picks not logged for $ET_DATE*%0A%0ATime: $ET_HOUR:$ET_MIN ET%0A%0AThe premarket picks workflow has not produced rows in data/picks_log.csv yet.%0A%0A$WINDOW_NOTE%0A%0ARescue triggered: $RESCUE_TRIGGERED$EXTERNAL_NOTE%0A%0AManual run: Actions → Daily Stock Picks → Run workflow"

          SENT=0
          for CHAT in "$TELEGRAM_CHAT_ID" "$TELEGRAM_GROUP_CHAT_ID"; do
            if [ -z "$CHAT" ]; then
              continue
            fi
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"               -d "chat_id=$CHAT"               -d "text=$MSG"               -d "parse_mode=Markdown" >/tmp/watchdog_telegram_response.txt || true

            if grep -q '"ok":true' /tmp/watchdog_telegram_response.txt; then
              echo "✅ Watchdog alert sent to chat ${CHAT:0:6}…"
              SENT=1
            else
              echo "⚠️ Watchdog alert may have failed for chat ${CHAT:0:6}…"
              cat /tmp/watchdog_telegram_response.txt || true
            fi
          done

          if [ "$SENT" -eq 0 ]; then
            python scripts/record_daily_picks_run_status.py --workflow watchdog --event watchdog_alert --result failed --reason "no Telegram alert confirmed" --telegram-sent failed
            echo "❌ No watchdog Telegram alert was confirmed"
            exit 1
          fi

          python scripts/record_daily_picks_run_status.py --workflow watchdog --event watchdog_alert --result success --reason "missing-picks Telegram alert sent" --telegram-sent success
          echo "🚨 Watchdog alert sent — daily picks missing before cutoff"
          exit 1

      - name: Commit watchdog run-status artifact
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/daily_picks_run_status_*.jsonl 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ℹ No watchdog run-status changes to commit"
            exit 0
          fi
          git commit -m "status: watchdog daily picks check $(TZ='America/New_York' date +%Y-%m-%dT%H:%M%z) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "[watchdog-status-push] retry $i/3"
            sleep $((i * 2))
          done
          echo "❌ Failed to push watchdog run-status artifact"
          exit 1
