name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest

      - name: Syntax check (all .py)
        run: |
          python -c "
          import ast, pathlib, sys
          errs = 0
          for p in pathlib.Path('.').rglob('*.py'):
              if '.venv' in p.parts or 'site-packages' in p.parts:
                  continue
              try:
                  ast.parse(p.read_text())
              except SyntaxError as e:
                  print(f'❌ {p}: {e}')
                  errs += 1
          sys.exit(errs)
          "

      - name: Run pytest
        run: pytest tests/ -q --tb=short

      - name: Verify wisdom bootstrap is idempotent
        run: |
          python scripts/bootstrap_wisdom.py
          python scripts/bootstrap_wisdom.py

      - name: Smoke test — quarterly report
        run: python scripts/quarterly_report.py --days 30

      - name: Smoke test — weekly review
        run: python scripts/send_weekly_review.py --no-send
