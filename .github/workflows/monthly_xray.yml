name: Monthly X-Ray

on:
  schedule:
    # Single fire — 1st of month, 6 AM SGT = 22:00 UTC on 1st.
    # After US market close in both EDT and EST, so one cron all year.
    - cron: '0 22 1 * *'
  workflow_dispatch:

concurrency:
  group: monthly-xray
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  monthly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dedup guard (skip if already ran today)
        id: guard
        run: |
          SGT_DATE=$(TZ='Asia/Singapore' date +%Y-%m-%d)
          MARKER="data/.last_run_monthly_xray.txt"
          if [ -f "$MARKER" ] && [ "$(cat $MARKER)" = "$SGT_DATE" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "⏭  Already ran today ($SGT_DATE) — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ First run today ($SGT_DATE) — proceeding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            mkdir -p data
            echo "$SGT_DATE" > "$MARKER"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with: { python-version: '3.11' }

      - name: Install deps
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Generate monthly X-ray
        if: steps.guard.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/monthly_xray.py

      - name: Post as GitHub issue
        if: steps.guard.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().split('T')[0];
            let body;
            try { body = fs.readFileSync(`data/learning/monthly_xray_${date}.md`, 'utf8'); }
            catch (e) { body = '_Not generated_'; }
            body += `\n\n---\n\n## Monthly Decision\n\n1. Did the system make money?\n2. Did our tweaks help?\n3. What experiments next month?`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `📅 Monthly X-Ray ${date}`,
              body: body,
              labels: ['monthly-review','needs-review'],
              assignees: ['anjanneogi13']
            });

      - name: Telegram notify
        if: steps.guard.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        run: python scripts/send_layman_monthly.py

      - name: Commit + marker
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/learning/monthly_xray_*.md data/.last_run_monthly_xray.txt
          git diff --staged --quiet || git commit -m "📅 Monthly X-Ray [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "[push] retry $i after conflict"; sleep 3
          done || true
