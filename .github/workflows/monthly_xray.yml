name: Monthly X-Ray

on:
  schedule:
    - cron: '0 20 1 * *'   # 4 PM EDT = 20:00 UTC, 1st of month
    - cron: '0 21 1 * *'   # 4 PM EST = 21:00 UTC, 1st of month
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monthly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dedup guard (skip if already ran today)
        run: |
          ET_DATE=$(TZ='America/New_York' date +%Y-%m-%d)
          MARKER="data/.last_run_${{ github.workflow }}.txt"
          if [ -f "$MARKER" ] && [ "$(cat $MARKER)" = "$ET_DATE" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "⏭  Already ran today ($ET_DATE) — skipping"
            exit 0
          fi
          mkdir -p data
          echo "$ET_DATE" > "$MARKER"

        with:
          fetch-depth: 0
      - name: Skip if duplicate DST cron fire
        run: |
          ET_HOUR=$(TZ='America/New_York' date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — bypassing guard ($ET_HOUR ET)"; exit 0
          fi
          if [ "$ET_HOUR" != "16" ]; then
            echo "Skipping duplicate DST fire — current $ET_HOUR ET, target 16 ET"
            exit 0
          fi
          echo "Running at $ET_HOUR ET (target match)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Generate monthly X-ray
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/monthly_xray.py

      - name: Post as GitHub issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().split('T')[0];
            let body;
            try { body = fs.readFileSync(`data/learning/monthly_xray_${date}.md`, 'utf8'); }
            catch (e) { body = '_Not generated_'; }
            body += `\n\n---\n\n## Monthly Decision\n\n1. Did the system make money?\n2. Did our tweaks help?\n3. What experiments next month?`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `📅 Monthly X-Ray ${date}`,
              body: body,
              labels: ['monthly-review','needs-review'],
              assignees: ['anjanneogi13']
            });

      - name: Telegram notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        run: |
          python scripts/send_monthly_telegram.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/learning/monthly_xray_*.md
          git diff --staged --quiet || git commit -m "Monthly X-Ray [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "[push] retry $i after conflict"; sleep 3
          done || true
