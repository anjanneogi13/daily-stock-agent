name: Daily Stock Picks

on:
  schedule:
    # 8:30 AM ET weekdays = 13:30 UTC (during EDT = Mar-Nov)
    - cron: '30 13 * * 1-5'
  workflow_dispatch:   # also lets you run manually from Actions tab

jobs:
  run-picks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install curl_cffi

      - name: Run agent
        run: |
          mkdir -p logs data
          python main.py 2>&1 | tee logs/run-$(date +%Y%m%d).log

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ logs/ || true
          git diff --staged --quiet || git commit -m "Daily picks $(date +%Y-%m-%d)"
          git push || echo "Nothing to push"
