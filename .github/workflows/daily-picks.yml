name: Daily Stock Picks

on:
  schedule:
    # Daily picks ~45 min before US market open (9:30 AM ET).
    # Multiple crons because GitHub Actions cron can be delayed 15-60 min.
    # ET-hour guard below ensures only ONE actually executes per day.
    - cron: '30 12 * * 1-5'   # 8:30 AM EDT (Mar–Nov)
    - cron: '45 12 * * 1-5'   # 8:45 AM EDT
    - cron: '0  13 * * 1-5'   # 9:00 AM EDT (catches delayed runs)
    - cron: '15 13 * * 1-5'   # 9:15 AM EDT (last chance EDT)
    - cron: '30 13 * * 1-5'   # 8:30 AM EST (Nov–Mar)
    - cron: '45 13 * * 1-5'   # 8:45 AM EST
    - cron: '0  14 * * 1-5'   # 9:00 AM EST (catches delayed runs)
    - cron: '15 14 * * 1-5'   # 9:15 AM EST (last chance EST)
  
  workflow_dispatch:

jobs:
  run-picks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: DST + dedup guard (only first run of day in 8:00–9:25 ET window)
        run: |
          ET_HOUR=$(TZ='America/New_York' date +%H)
          ET_MIN=$(TZ='America/New_York' date +%M)
          ET_DATE=$(TZ='America/New_York' date +%Y-%m-%d)
          echo "Now: $ET_DATE $ET_HOUR:$ET_MIN ET"

          # Manual dispatch always allowed
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "✅ Manual run — bypassing time guard"
            exit 0
          fi

          # Allow only between 08:00 and 09:25 ET (before market open at 09:30)
          ET_MINUTES_OF_DAY=$((10#$ET_HOUR * 60 + 10#$ET_MIN))
          WINDOW_START=$((8 * 60))     # 08:00
          WINDOW_END=$((9 * 60 + 25))  # 09:25
          if [ $ET_MINUTES_OF_DAY -lt $WINDOW_START ] || [ $ET_MINUTES_OF_DAY -gt $WINDOW_END ]; then
            echo "⏭  Outside 08:00–09:25 ET window — skipping"
            exit 0
          fi

          # De-dup: skip if today's premarket_check.json or picks_log already updated today
          if [ -f data/premarket_check.json ]; then
            LAST_DATE=$(python -c "import json; print(json.load(open('data/premarket_check.json')).get('date',''))" 2>/dev/null || echo "")
            if [ "$LAST_DATE" = "$ET_DATE" ]; then
              echo "⏭  Already ran today ($LAST_DATE) — skipping duplicate cron"
              exit 0
            fi
          fi

          echo "✅ Proceeding with daily picks at $ET_HOUR:$ET_MIN ET"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p logs data
          python main.py 2>&1 | tee logs/run-$(date +%Y%m%d).log

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/learning/ data/exec_report_*.json data/premarket_check.json data/picks_log.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Daily picks $(date +%Y-%m-%d) SGT"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "[push] retry $i after conflict"; sleep 3
          done || true

      - name: Premarket sanity check 🚦
        run: python scripts/premarket_check.py

      - name: Format picks as Markdown
        run: python scripts/format_picks_email.py > /tmp/picks_email.md

      - name: Create issue with picks (emails you)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().split('T')[0];
            let body;
            try {
              body = fs.readFileSync('/tmp/picks_email.md', 'utf8');
            } catch (e) {
              body = '## Daily Stock Picks\n\n_Formatter failed — see workflow logs._';
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📈 Daily Picks ${date}`,
              body: body,
              labels: ['daily-picks'],
              assignees: ['anjanneogi13']
            });

      - name: Send picks to Telegram 📲
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        run: python scripts/send_telegram.py
