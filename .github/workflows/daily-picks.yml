name: Daily Stock Picks

on:
  schedule:
    - cron: '0 9 * * 1-5'   # 5 PM SGT (9 AM UTC) Mon-Fri
  workflow_dispatch:

jobs:
  run-picks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p logs data
          python main.py 2>&1 | tee logs/run-$(date +%Y%m%d).log

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ logs/ || true
          git diff --staged --quiet || git commit -m "Daily picks $(date +%Y-%m-%d) SGT"
          git push || echo "Nothing to push"

      - name: Format picks as Markdown
        run: python scripts/format_picks_email.py > /tmp/picks_email.md

      - name: Create issue with picks (emails you)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().split('T')[0];
            let body;
            try {
              body = fs.readFileSync('/tmp/picks_email.md', 'utf8');
            } catch (e) {
              body = '## Daily Stock Picks\n\n_Formatter failed — see workflow logs._';
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📈 Daily Picks ${date}`,
              body: body,
              labels: ['daily-picks'],
              assignees: ['anjanneogi13']
            });

      - name: Send picks to Telegram 📲
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_telegram.py
