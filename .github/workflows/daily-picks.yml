name: Daily Stock Picks

on:
  schedule:
    # Run at 8:45 AM ET (~45 min before US market open)
    # Two crons because GitHub Actions doesn't handle DST — guard step skips the wrong one
    - cron: '45 12 * * 1-5'   # 8:45 AM EDT (Mar–Nov) = 8:45 PM SGT
    - cron: '45 13 * * 1-5'   # 8:45 AM EST (Nov–Mar) = 9:45 PM SGT
  workflow_dispatch:

jobs:
  run-picks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if not ~45min before US open (DST guard)
        run: |
          ET_HOUR=$(TZ='America/New_York' date +%H)
          ET_MIN=$(TZ='America/New_York' date +%M)
          # Allow manual dispatch any time
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "✅ Manual run — skipping time guard (currently $ET_HOUR:$ET_MIN ET)"
            exit 0
          fi
          if [ "$ET_HOUR" != "08" ]; then
            echo "⏭  Not 8 AM ET window (currently $ET_HOUR:$ET_MIN ET) — skipping duplicate cron"
            exit 0
          fi
          echo "✅ Running at $ET_HOUR:$ET_MIN ET (~45 min before US open)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p logs data
          python main.py 2>&1 | tee logs/run-$(date +%Y%m%d).log

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/learning/ data/exec_report_*.json data/premarket_check.json data/picks_log.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Daily picks $(date +%Y-%m-%d) SGT"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "[push] retry $i after conflict"; sleep 3
          done || true

      - name: Premarket sanity check 🚦
        run: python scripts/premarket_check.py

      - name: Format picks as Markdown
        run: python scripts/format_picks_email.py > /tmp/picks_email.md

      - name: Create issue with picks (emails you)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().split('T')[0];
            let body;
            try {
              body = fs.readFileSync('/tmp/picks_email.md', 'utf8');
            } catch (e) {
              body = '## Daily Stock Picks\n\n_Formatter failed — see workflow logs._';
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📈 Daily Picks ${date}`,
              body: body,
              labels: ['daily-picks'],
              assignees: ['anjanneogi13']
            });

      - name: Send picks to Telegram 📲
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        run: python scripts/send_telegram.py
