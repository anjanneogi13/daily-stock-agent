name: Daily Stock Picks

on:
  schedule:
    # Reliability hardening:
    # GitHub scheduled workflows are best-effort and can be delayed.
    # Use frequent guarded premarket attempts, then let the ET guard below decide:
    # - run official picks only during the safe premarket window,
    # - skip duplicates if picks are already logged via the picks_log.csv dedup guard,
    # - send missed-window alerts after the 09:20 ET cutoff.
    #
    # Minute offsets avoid the most crowded top-of-hour cron slots.
    # The 12-14 UTC range covers both EDT and EST premarket windows.
    - cron: '5,20,35,50 12-14 * * 1-5'

  workflow_dispatch:

# 🚨 CRITICAL FIX: Only one run at a time. Subsequent runs same day will be cancelled.
# This prevents the parallel push conflicts that lost CSV writes today (Apr 30).
concurrency:
  group: daily-picks-${{ github.ref }}
  cancel-in-progress: false  # Let first run complete; queue/skip later ones

jobs:
  run-picks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for rebase
          ref: main      # Always use latest main, even on workflow_dispatch

      - name: DST + dedup guard (skip if already ran today)
        id: guard
        run: |
          ET_HOUR=$(TZ='America/New_York' date +%H)
          ET_MIN=$(TZ='America/New_York' date +%M)
          ET_DATE=$(TZ='America/New_York' date +%Y-%m-%d)
          echo "Now: $ET_DATE $ET_HOUR:$ET_MIN ET"

          # Official premarket picks are allowed only before 09:20 ET.
          # Manual dispatch must not bypass this freshness/timing gate.
          ET_MINUTES_OF_DAY=$((10#$ET_HOUR * 60 + 10#$ET_MIN))
          WINDOW_START=$((8 * 60))
          OFFICIAL_CUTOFF=$((9 * 60 + 20))
          echo "missed_window=false" >> $GITHUB_OUTPUT

          if [ $ET_MINUTES_OF_DAY -lt $WINDOW_START ]; then
            echo "⏭ Before 08:00 ET window — skipping"
            echo "should_run=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ $ET_MINUTES_OF_DAY -gt $OFFICIAL_CUTOFF ]; then
            echo "⏭ Official premarket window missed after 09:20 ET — no normal daily picks"
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "missed_window=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 🚨 NEW: Check picks_log.csv directly (more reliable than premarket_check.json)
          if [ -f data/picks_log.csv ]; then
            TODAY_ROWS=$(grep -c "^$ET_DATE" data/picks_log.csv 2>/dev/null || echo 0)
            if [ "$TODAY_ROWS" -gt 0 ]; then
              echo "⏭ Already have $TODAY_ROWS picks logged for $ET_DATE — skipping"
              echo "should_run=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "✅ Proceeding with daily picks at $ET_HOUR:$ET_MIN ET"
          echo "should_run=true" >> $GITHUB_OUTPUT

      - name: Send missed-window Telegram alert
        if: steps.guard.outputs.missed_window == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        run: |
          python scripts/send_missed_premarket_alert.py

      - name: Set up Python
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.guard.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run smoke tests
        if: steps.guard.outputs.should_run == 'true'
        run: pytest tests/ -v --tb=short || (echo "❌ tests failed — check before deploying" && exit 1)

      - name: Build per-stock statistics 🧠 (Pillar 1 brain coverage)
        if: steps.guard.outputs.should_run == 'true'
        run: |
          echo "Building stock_stats for top 100 tickers (~3 min)..."
          python scripts/build_stock_stats.py --top100 || echo "⚠ Stats build failed — brain will fall back to defaults (non-fatal)"
          echo "✓ Stats coverage: $(ls data/stock_stats/ 2>/dev/null | wc -l) tickers"
        continue-on-error: true

      - name: Run agent
        if: steps.guard.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p logs data
          python main.py 2>&1 | tee logs/run-$(date +%Y%m%d).log

      - name: Verify CSV was written
        if: steps.guard.outputs.should_run == 'true'
        run: |
          ET_DATE=$(TZ='America/New_York' date +%Y-%m-%d)
          TODAY_ROWS=$(grep -c "^$ET_DATE" data/picks_log.csv 2>/dev/null || echo 0)
          if [ "$TODAY_ROWS" -eq 0 ]; then
            echo "❌ CRITICAL: main.py ran but no picks logged for $ET_DATE!"
            echo "Last 5 dates in CSV:"
            cut -d',' -f1 data/picks_log.csv | sort -u | tail -5
            exit 1
          else
            echo "✅ Verified $TODAY_ROWS picks logged for $ET_DATE"
          fi

      - name: Commit results (with retry safety)
        if: steps.guard.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/learning/ data/exec_report_*.json data/premarket_check.json data/picks_log.csv data/telegram_sent.json data/learning_journal.jsonl data/last_regime.json data/hard_blocks_log.json data/agent_memoir.json data/weight_history.jsonl 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "ℹ No changes to commit"
            exit 0
          fi

          git commit -m "Daily picks $(date +%Y-%m-%d) SGT"

          # Robust push with retries + auto-stash to avoid 'unstaged changes' rebase failures
          PUSH_OK=0
          for i in 1 2 3 4 5; do
            # Stash any unstaged changes from concurrent steps (premarket, news, etc.)
            STASHED=0
            if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
              git stash push --include-untracked -m "auto-stash-push-attempt-$i" >/dev/null 2>&1 && STASHED=1
            fi

            if git pull --rebase origin main && git push; then
              PUSH_OK=1
              echo "✅ Push succeeded on attempt $i"
              [ "$STASHED" -eq 1 ] && git stash pop >/dev/null 2>&1 || true
              break
            fi

            # Restore stash before retry
            [ "$STASHED" -eq 1 ] && git stash pop >/dev/null 2>&1 || true
            echo "[push] retry $i/5 after conflict — sleeping ${i}s"
            sleep $((i * 2))
          done

          if [ "$PUSH_OK" -eq 0 ]; then
            echo "❌ CRITICAL: All 5 push attempts failed — CSV write LOST"
            exit 1
          fi

      - name: Premarket sanity check 🚦
        if: steps.guard.outputs.should_run == 'true'
        run: python scripts/premarket_check.py

      - name: Format picks as Markdown
        if: steps.guard.outputs.should_run == 'true'
        run: python scripts/format_picks_email.py > /tmp/picks_email.md

      - name: Create issue with picks (emails you)
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { upsertIssue } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/upsert_issue.js`);
            const date = new Date().toISOString().split('T')[0];
            let body;
            try {
              body = fs.readFileSync('/tmp/picks_email.md', 'utf8');
            } catch (e) {
              body = '## Daily Stock Picks\n\n_Formatter failed — see workflow logs._';
            }
            await upsertIssue({
              github,
              context,
              title: `📈 Daily Picks ${date}`,
              body,
              labels: ['daily-picks'],
              assignees: ['anjanneogi13'],
            });

      - name: Send picks to Telegram 📲
        if: steps.guard.outputs.should_run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        run: python scripts/send_layman_daily.py

      - name: Commit post-send artifacts (M-B fix)
        if: always() && steps.guard.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Include picks_log.csv here as a recovery path: if the first commit/push
          # was skipped or raced, the post-send commit must still persist today's row.
          git add -f data/picks_log.csv data/telegram_sent.json data/premarket_check.json data/learning_journal.jsonl 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "ℹ No post-send changes to commit"
            exit 0
          fi

          git commit -m "📲 Post-send state $(date +%Y-%m-%d) [skip ci]"

          POST_PUSH_OK=0
          for i in 1 2 3 4 5; do
            STASHED=0
            if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
              git stash push --include-untracked -m "auto-stash-post-send-$i" >/dev/null 2>&1 && STASHED=1
            fi

            if git pull --rebase origin main && git push; then
              POST_PUSH_OK=1
              echo "✅ Post-send push succeeded on attempt $i"
              [ "$STASHED" -eq 1 ] && git stash pop >/dev/null 2>&1 || true
              break
            fi

            [ "$STASHED" -eq 1 ] && git stash pop >/dev/null 2>&1 || true
            echo "[push] post-send retry $i/5"
            sleep $((i * 2))
          done

          if [ "$POST_PUSH_OK" -eq 0 ]; then
            echo "❌ CRITICAL: post-send artifacts were committed locally but not pushed"
            git status --short
            exit 1
          fi
