name: 🧠 Weekend Reflection

on:
  schedule:
    # Single fire — 8 AM SGT Saturday = 00:00 UTC Saturday.
    # SGT does not observe DST → one cron, no duplicate fire.
    # Runs ~1h before weekly_report so reflection feeds into it.
    - cron: '0 0 * * 6'
  workflow_dispatch:

concurrency:
  group: weekend-reflection
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  reflect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dedup guard (skip if already ran today)
        id: guard
        run: |
          SGT_DATE=$(TZ='Asia/Singapore' date +%Y-%m-%d)
          MARKER="data/.last_run_weekend_reflection.txt"
          if [ -f "$MARKER" ] && [ "$(cat $MARKER)" = "$SGT_DATE" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "⏭  Already ran today ($SGT_DATE) — skipping all subsequent steps"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ First run today ($SGT_DATE) — proceeding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            mkdir -p data
            echo "$SGT_DATE" > "$MARKER"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with: { python-version: '3.11' }

      - name: Install deps
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Run weekend reflection
        if: steps.guard.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/weekend_reflection.py

      - name: Post review as GitHub issue (emails you)
        if: steps.guard.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().split('T')[0];
            let body;
            try { body = fs.readFileSync(`data/learning/weekly_review_${date}.md`, 'utf8'); }
            catch (e) { body = '_Review not generated_'; }
            body += `\n\n---\n\n## 👤 Your Move\n\nReview the suggestions above. To apply any:\n1. Read "Where in the code"\n2. Make the change yourself in your editor\n3. Commit and push\n\n**Never apply a Low-confidence suggestion without thinking it through.**`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `🧠 Weekend Review ${date} — Review Suggestions`,
              body: body,
              labels: ['weekend-review', 'needs-review'],
              assignees: ['anjanneogi13']
            });

      - name: Telegram notify
        if: steps.guard.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        run: python scripts/send_weekend_telegram.py

      - name: Commit weekly review + marker
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/learning/ data/exec_report_*.json data/premarket_check.json \
                     data/picks_log.csv data/.last_run_weekend_reflection.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "🧠 Weekend review [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "[push] retry $i after conflict"; sleep 3
          done || true
