name: 🧠 Nightly Brain Maintenance

on:
  schedule:
    # 23:00 UTC daily — runs AFTER evaluate.yml (22:00 UTC) so picks_log
    # already has today's outcomes attached
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly-brain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Run nightly brain conductor
        run: python scripts/run_nightly_brain.py


      - name: Verify brain steps succeeded (M6)
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          meta_path = Path("data/brain_state_meta.json")
          if not meta_path.exists():
              print("M6: data/brain_state_meta.json missing after conductor run")
              sys.exit(1)
          meta = json.loads(meta_path.read_text())
          failed = int(meta.get("steps_failed", 0))
          print(f"M6: run_id={meta.get('run_id', 'unknown')} failed_steps={failed}")
          if failed >= 4:
              print("M6: too many brain steps failed — failing workflow")
              sys.exit(1)
          PY
      - name: Commit brain state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # KILL-2 (audit 2026-06-24): strategy config is NO LONGER auto-committed.
          # config/weights.json must change only via a reviewed PR (human-in-loop).
          # The data/* files below are brain MEMORY and ARE still persisted on purpose.
          # Task 1 (audit P0): force-add (-f) is REQUIRED. data/ is gitignored
          # (.gitignore:225), so a plain `git add` of these paths is a silent
          # no-op -- which is why brain state never persisted (the audit's
          # "5%/week cap silently became 5%/night" bug: weight_history.jsonl
          # was never committed, so the weekly accounting reset every run).
          # -f bypasses the ignore for these specific, intentionally-persisted
          # state files while keeping them ignored for humans locally.
          #
          # Task 1 fix (issue #290): the root cause of the "git add -f silently
          # no-ops" bug is that these three files often don't exist on disk when
          # the conductor produces nothing new (no weight applied, no memoir
          # written).  Ensure they always exist before `git add -f` so the add
          # never silently skips them and the weekly cap / calibration / memoir
          # state is committed on EVERY nightly run, not just when something
          # changed.
          [ -f data/weight_history.jsonl ] || : > data/weight_history.jsonl
          [ -f data/pattern_stats.json ]  || echo '{}' > data/pattern_stats.json
          [ -f data/agent_memoir.json ]   || echo '{}' > data/agent_memoir.json
          for path in \
            data/patterns.jsonl \
            data/pattern_stats.json \
            data/weight_proposals.jsonl \
            data/weight_history.jsonl \
            data/learning_journal.jsonl \
            data/agent_memoir.json \
            data/brain_state_meta.json
          do
            if [ -e "$path" ]; then
              git add -f "$path"
            fi
          done
          # Defensive tripwire: run_nightly() now always rewrites
          # data/brain_state_meta.json, so an empty staged set means the
          # conductor failed to persist any brain state for this run.
          if git diff --cached --quiet; then
            echo "ERROR: nightly brain run staged no persisted state files"
            exit 1
          fi
          git commit -m "🧠 nightly brain maintenance $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            sleep 5
          done

  meta-brain-sunday:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 23 * * *' || github.event_name == 'workflow_dispatch'
    needs: nightly-brain
    steps:
      - name: Check if today is Sunday
        id: dow
        run: |
          DOW=$(date -u +%u)   # 1=Mon ... 7=Sun
          if [ "$DOW" = "7" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "send=true" >> $GITHUB_OUTPUT
          else
            echo "send=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.dow.outputs.send == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.dow.outputs.send == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        if: steps.dow.outputs.send == 'true'
        run: pip install -r requirements.txt

      - name: Send weekly Self-Improvement Report
        if: steps.dow.outputs.send == 'true'
        env:
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:        ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID:  ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        run: python scripts/send_meta_brain_telegram.py
