name: Intraday Monitor

on:
  schedule:
    # Targeted opening-range checks:
    # - 09:35 ET and 09:45 ET are covered by 13/14 UTC during DST/EST.
    # - The guard below skips off-target 35/45-minute fires, so these do not
    #   become random 10:35/10:45 scans during DST.
    - cron: '35,45 13-14 * * 1-5'
    # Baseline intraday monitor:
    # - Every 30 min during US market hours (9:30 AM - 4:00 PM ET).
    # - Single cron range covers both EDT (13:30-20:00 UTC) and EST
    #   (14:30-21:00 UTC); the ET guard below skips off-hours fires.
    # - This also covers the 10:00 ET opening-range follow-up.
    - cron: '0,30 13-21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: intraday-monitor-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if outside US market hours (DST guard)
        run: |
          ET_HOUR=$(TZ='America/New_York' date +%H)
          ET_MIN=$(TZ='America/New_York' date +%M)
          ET_DOW=$(TZ='America/New_York' date +%u)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "✅ Manual run — bypassing time guard ($ET_HOUR:$ET_MIN ET)"
            exit 0
          fi
          # Skip weekends
          if [ "$ET_DOW" -gt 5 ]; then
            echo "⏭  Weekend — skipping"; exit 0
          fi
          # Opening-range targeted cron fires at :35/:45 in two UTC hours to
          # cover both EDT and EST. Only allow those minute-specific scheduled
          # runs when they are actually 09:35/09:45 ET.
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$ET_MIN" = "35" ] || [ "$ET_MIN" = "45" ]; }; then
            if [ "$ET_HOUR" != "09" ]; then
              echo "⏭  Off-target opening-range fire ($ET_HOUR:$ET_MIN ET) — skipping"
              exit 0
            fi
          fi
          # Market hours: 9:30 AM - 4:00 PM ET
          # Allow 9:30, 10:00, 10:30, ..., 16:00
          if [ "$ET_HOUR" -lt 9 ] || [ "$ET_HOUR" -gt 16 ]; then
            echo "⏭  Outside market hours ($ET_HOUR:$ET_MIN ET) — skipping"; exit 0
          fi
          if [ "$ET_HOUR" = "09" ] && [ "$ET_MIN" -lt 30 ]; then
            echo "⏭  Before market open ($ET_HOUR:$ET_MIN ET) — skipping"; exit 0
          fi
          if [ "$ET_HOUR" = "16" ] && [ "$ET_MIN" -gt 5 ]; then
            echo "⏭  After market close ($ET_HOUR:$ET_MIN ET) — skipping"; exit 0
          fi
          echo "✅ Running at $ET_HOUR:$ET_MIN ET (market open)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Run intraday monitor
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/intraday_monitor.py

      - name: Send Telegram alert (if any)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        run: python scripts/send_intraday_telegram.py

      - name: Commit alert log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/intraday_alerts_*.json 2>/dev/null || true
          git add data/opening_range_observations_*.jsonl 2>/dev/null || true
          git add data/opening_range_run_status_*.jsonl 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "intraday: alert dedupe log $(date -u +%Y-%m-%dT%H:%M)"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."; sleep 5
            done
          fi
