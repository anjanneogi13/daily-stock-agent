name: News Evidence

# Monitoring-only evidence workflow.
# Builds news outcome attribution and evidence reports after market close.
# It must not create official picks, paper trades, live trades, or journal mutations.

on:
  schedule:
    # Weekdays after US market close.
    # 22:30 UTC is 18:30 ET during EDT and 17:30 ET during EST.
    - cron: '30 22 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: 'ET date to report, YYYY-MM-DD. Defaults to today in America/New_York.'
        required: false
        type: string
      max_items:
        description: 'Maximum news outcome evidence rows to attribute.'
        required: false
        default: '100'
        type: string
      horizon_days:
        description: 'Trading-day horizon for outcome attribution.'
        required: false
        default: '3'
        type: string

concurrency:
  group: news-evidence-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAPER_TRADING_ENABLED: "false"
      LIVE_TRADING_ENABLED: "false"
      TRADING_MODE: "monitoring"
      SMELL_ENFORCE: "false"
      BRAIN_ENFORCE_EV: "false"
      AUTO_PAUSE_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Resolve ET date and limits
        id: params
        env:
          INPUT_DATE: ${{ inputs.date }}
          INPUT_MAX_ITEMS: ${{ inputs.max_items }}
          INPUT_HORIZON_DAYS: ${{ inputs.horizon_days }}
        run: |
          REPORT_DATE="${INPUT_DATE:-$(TZ='America/New_York' date +%Y-%m-%d)}"
          MAX_ITEMS="${INPUT_MAX_ITEMS:-100}"
          HORIZON_DAYS="${INPUT_HORIZON_DAYS:-3}"

          if ! echo "$REPORT_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "Invalid REPORT_DATE: $REPORT_DATE"
            exit 1
          fi
          if ! echo "$MAX_ITEMS" | grep -Eq '^[0-9]+$'; then
            echo "Invalid MAX_ITEMS: $MAX_ITEMS"
            exit 1
          fi
          if ! echo "$HORIZON_DAYS" | grep -Eq '^[0-9]+$'; then
            echo "Invalid HORIZON_DAYS: $HORIZON_DAYS"
            exit 1
          fi

          echo "report_date=$REPORT_DATE" >> "$GITHUB_OUTPUT"
          echo "max_items=$MAX_ITEMS" >> "$GITHUB_OUTPUT"
          echo "horizon_days=$HORIZON_DAYS" >> "$GITHUB_OUTPUT"

          echo "REPORT_DATE=$REPORT_DATE"
          echo "MAX_ITEMS=$MAX_ITEMS"
          echo "HORIZON_DAYS=$HORIZON_DAYS"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install yfinance==0.2.65 curl_cffi==0.7.4

      - name: Preflight no-write outcome attribution
        run: |
          python scripts/news_signal_outcome_attribution.py \
            --date "${{ steps.params.outputs.report_date }}" \
            --max-items "${{ steps.params.outputs.max_items }}" \
            --horizon-days "${{ steps.params.outputs.horizon_days }}" \
            --no-write

      - name: Preflight no-write evidence report
        run: |
          python scripts/news_signal_evidence_report.py \
            --date "${{ steps.params.outputs.report_date }}" \
            --no-write

      - name: Generate news outcome attribution artifact
        run: |
          python scripts/news_signal_outcome_attribution.py \
            --date "${{ steps.params.outputs.report_date }}" \
            --max-items "${{ steps.params.outputs.max_items }}" \
            --horizon-days "${{ steps.params.outputs.horizon_days }}"

      - name: Generate news evidence report artifacts
        run: |
          python scripts/news_signal_evidence_report.py \
            --date "${{ steps.params.outputs.report_date }}"

      - name: Safety check official state was not mutated
        run: |
          git diff --exit-code -- \
            data/picks_log.csv \
            data/signal_journal.jsonl \
            data/learning_journal.jsonl \
            data/premarket_check.json \
            data/telegram_sent.json

      - name: Commit news evidence artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f \
            "data/news_signal_outcomes_${{ steps.params.outputs.report_date }}.jsonl" \
            "data/news_signal_evidence_report_${{ steps.params.outputs.report_date }}.json" \
            "data/news_signal_evidence_report_${{ steps.params.outputs.report_date }}.md" \
            2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No news evidence artifact changes to commit"
            exit 0
          fi

          git commit -m "news evidence report ${{ steps.params.outputs.report_date }} [skip ci]"

          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "[news-evidence-push] retry $i/5"
            sleep $((i * 2))
          done

          echo "Failed to push news evidence artifacts"
          exit 1
