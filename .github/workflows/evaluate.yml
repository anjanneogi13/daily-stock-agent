name: Evaluate Picks Daily

on:
  schedule:
    # 4 AM SGT = 8 PM UTC = 4 PM ET (US market close)
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write   # so we can commit updated picks_log.csv
  issues: write    # so we can post dashboard issues

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Evaluate pending picks
        run: python scripts/evaluate_picks.py

      - name: Commit updated picks_log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/learning/ data/exec_report_*.json data/premarket_check.json data/picks_log.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "📊 Daily pick evaluation [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "[push] retry $i after conflict"; sleep 3
          done || true

      - name: Generate dashboard text
        run: python scripts/performance_dashboard.py > /tmp/dashboard.txt 2>&1 || true

      - name: Post dashboard as GitHub issue (emails you) 📧
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().split('T')[0];
            let body = '## 📊 Performance Dashboard\n\n```\n';
            try { body += fs.readFileSync('/tmp/dashboard.txt', 'utf8'); }
            catch (e) { body += '(no dashboard output)'; }
            body += '\n```\n\n_Auto-generated after US market close._';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Performance Update ${date}`,
              body: body,
              labels: ['performance'],
              assignees: ['anjanneogi13']
            });

      - name: Send dashboard to Telegram 📲
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_dashboard_telegram.py

      - name: Generate execution X-ray report 🔬
        run: |
          DATE=$(date -u +%Y-%m-%d)
          python scripts/daily_execution_report.py $DATE > /tmp/exec_report.txt 2>&1 || true
          cat /tmp/exec_report.txt

      - name: Post execution report as GitHub issue (emails you) 📧
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().split('T')[0];
            let body = '## 🔬 Daily Execution X-Ray\n\n```\n';
            try { body += fs.readFileSync('/tmp/exec_report.txt', 'utf8'); }
            catch (e) { body += '(no report)'; }
            body += '\n```\n\n_Per-pick breakdown: did fill? SL or TP first? Money left on table?_';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔬 Execution Report ${date}`,
              body: body,
              labels: ['execution-report'],
              assignees: ['anjanneogi13']
            });

      - name: Send execution report to Telegram 📲
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          python scripts/send_exec_telegram.py $DATE

      - name: 📓 Daily observation logging (agent learning)
        run: |
          DATE=$(date -u +%Y-%m-%d)
          python scripts/daily_observation.py $DATE

      - name: Commit observations
        run: |
          git add -f data/learning/ data/exec_report_*.json data/premarket_check.json data/picks_log.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "📓 Daily observations [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "[push] retry $i after conflict"; sleep 3
          done || true

      - name: Commit exec report JSON
        run: |
          git add -f data/learning/ data/exec_report_*.json data/premarket_check.json data/picks_log.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "🔬 Exec report [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "[push] retry $i after conflict"; sleep 3
          done || true
