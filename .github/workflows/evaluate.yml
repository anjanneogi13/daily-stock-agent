name: Evaluate Picks Daily

on:
  schedule:
    # 4 AM SGT = 8 PM UTC = 4 PM ET (US market close)
    - cron: '0 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write   # so we can commit updated picks_log.csv

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Evaluate pending picks
        run: python scripts/evaluate_picks.py

      - name: Commit updated picks_log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/picks_log.csv
          git diff --staged --quiet || git commit -m "📊 Daily pick evaluation [skip ci]"
          git push
