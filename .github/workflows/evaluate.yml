name: Evaluate Picks Daily

on:
  schedule:
    # Single fire — 6 AM SGT Tue–Sat = 22:00 UTC Mon–Fri.
    # 22:00 UTC is AFTER US market close in BOTH EDT (16:00 ET) and
    # EST (17:00 ET), so one cron handles all year, no DST race.
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

concurrency:
  group: evaluate-picks
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dedup guard (skip if already ran today)
        id: guard
        run: |
          SGT_DATE=$(TZ='Asia/Singapore' date +%Y-%m-%d)
          MARKER="data/.last_run_evaluate.txt"
          if [ -f "$MARKER" ] && [ "$(cat $MARKER)" = "$SGT_DATE" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "⏭  Already ran today ($SGT_DATE) — skipping all subsequent steps"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ First run today ($SGT_DATE) — proceeding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            mkdir -p data
            echo "$SGT_DATE" > "$MARKER"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with: { python-version: '3.12' }

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Evaluate pending picks
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/evaluate_picks.py

      - name: Commit updated picks_log + marker
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/learning/ data/exec_report_*.json data/premarket_check.json \
                     data/picks_log.csv data/.last_run_evaluate.txt \
                     data/signal_journal.jsonl data/learning_journal.jsonl 2>/dev/null || true
          git diff --staged --quiet || git commit -m "📊 Daily pick evaluation [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "[push] retry $i after conflict"; sleep 3
          done || true

      - name: Generate dashboard text
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/performance_dashboard.py > /tmp/dashboard.txt 2>&1 || true

      - name: Post dashboard as GitHub issue (emails you) 📧
        if: steps.guard.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().split('T')[0];
            let body = '## 📊 Performance Dashboard\n\n```\n';
            try { body += fs.readFileSync('/tmp/dashboard.txt', 'utf8'); }
            catch (e) { body += '(no dashboard output)'; }
            body += '\n```\n\n_Auto-generated after US market close._';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Performance Update ${date}`,
              body: body,
              labels: ['performance'],
              assignees: ['anjanneogi13']
            });

      - name: Send dashboard to Telegram 📲
        if: steps.guard.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        run: python scripts/send_layman_evening.py

      - name: Generate execution X-ray report 🔬
        if: steps.guard.outputs.skip != 'true'
        run: |
          DATE=$(date -u +%Y-%m-%d)
          python scripts/daily_execution_report.py $DATE > /tmp/exec_report.txt 2>&1 || true
          cat /tmp/exec_report.txt

      - name: Post execution report as GitHub issue (emails you) 📧
        if: steps.guard.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().split('T')[0];
            let body = '## 🔬 Daily Execution X-Ray\n\n```\n';
            try { body += fs.readFileSync('/tmp/exec_report.txt', 'utf8'); }
            catch (e) { body += '(no report)'; }
            body += '\n```\n\n_Per-pick breakdown: did fill? SL or TP first? Money left on table?_';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔬 Execution Report ${date}`,
              body: body,
              labels: ['execution-report'],
              assignees: ['anjanneogi13']
            });

      - name: Send execution report to Telegram 📲
        if: steps.guard.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          python scripts/send_exec_telegram.py $DATE

      - name: Send position monitor alerts to Telegram ⏰
        if: steps.guard.outputs.skip != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_position_alerts.py
        continue-on-error: true

      - name: 📓 Daily observation logging (agent learning)
        if: steps.guard.outputs.skip != 'true'
        run: |
          DATE=$(date -u +%Y-%m-%d)
          python scripts/daily_observation.py $DATE

      - name: Commit observations + exec report
        if: steps.guard.outputs.skip != 'true'
        run: |
          git add -f data/learning/ data/exec_report_*.json data/premarket_check.json data/picks_log.csv data/learning_journal.jsonl data/signal_journal.jsonl 2>/dev/null || true
          git diff --staged --quiet || git commit -m "📓 Daily observations + exec report [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "[push] retry $i after conflict"; sleep 3
          done || true
