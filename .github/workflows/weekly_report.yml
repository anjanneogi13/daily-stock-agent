name: Weekly Performance Report

on:
  schedule:
    # Single fire — 9 AM SGT Saturday = 01:00 UTC Saturday.
    # SGT does not observe DST, so one cron is sufficient and
    # eliminates the duplicate-fire race the previous DST-spread had.
    - cron: '0 1 * * 6'
  workflow_dispatch:

# Belt-and-suspenders: even if a stray duplicate cron is added later,
# concurrency group cancels overlapping runs.
concurrency:
  group: weekly-report
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dedup guard (skip if already ran today)
        id: guard
        run: |
          SGT_DATE=$(TZ='Asia/Singapore' date +%Y-%m-%d)
          MARKER="data/.last_run_weekly_report.txt"
          if [ -f "$MARKER" ] && [ "$(cat $MARKER)" = "$SGT_DATE" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "⏭  Already ran today ($SGT_DATE) — skipping all subsequent steps"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ First run today ($SGT_DATE) — proceeding"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            mkdir -p data
            echo "$SGT_DATE" > "$MARKER"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with: { python-version: '3.11' }

      - name: Install deps
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Generate weekly report
        if: steps.guard.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/weekly_report_card.py

      - name: Post as GitHub issue
        if: steps.guard.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().split('T')[0];
            let body;
            try { body = fs.readFileSync(`data/weekly_reports/report_${date}.md`, 'utf8'); }
            catch (e) { body = '_Not generated_'; }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `📊 Weekly Report — ${date}`,
              body: body,
              labels: ['weekly-report'],
            });


      - name: Send weekly recap to Telegram (layman)
        env:
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_CHAT_ID: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
        run: python scripts/send_layman_weekly.py
      - name: Commit metrics + marker
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # CRITICAL: include the marker file so next run sees it
          git add -f data/metrics_daily.json data/metrics_history.jsonl \
                     data/weekly_reports/ data/.last_run_weekly_report.txt
          git diff --staged --quiet || git commit -m "📊 Weekly report [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 3
          done || true
