name: News Engine

# Pulls news, classifies with Claude, updates watchlist.
# Runs every 30 min during US trading hours + pre/post market.

on:
  schedule:
    # Pre-market & market hours, every 30 min (UTC)
    # 4:00 AM ET to 8:00 PM ET = 08:00 UTC to 00:00 UTC next day (EDT)
    - cron: '*/30 8-23 * * 1-5'   # EDT coverage (Mar–Nov)
    - cron: '*/30 9-23 * * 1-5'   # EST coverage (Nov–Mar) — overlaps OK, dedup handles it
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news engine
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_news_engine.py

      - name: Commit news state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/watchlist.json data/news_log.jsonl data/news_seen.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "🔔 News engine update [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "[push] retry $i"
            sleep 3
          done || true